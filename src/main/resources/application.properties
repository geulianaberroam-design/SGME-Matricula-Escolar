# ============================================================
# SGME - Configuración de la API (Spring Boot)
# ============================================================

spring.application.name=matricula-api

# Puerto de la API. React (axios) apunta a http://localhost:8080/api
server.port=${PORT:8080}

# ------------------------------------------------------------
# PostgreSQL (los valores por defecto son los que usabas en Python).
# Se pueden cambiar con variables de entorno sin tocar este archivo:
#   DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD
# ------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:MatriculaEscolar}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

# "update" respeta tus tablas actuales y solo AGREGA las columnas nuevas
# (pago.concepto, pago.metodo_pago, pago.estado, documento.estado,
# documento.fecha_registro). Nunca borra datos.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ------------------------------------------------------------
# Logs (equivalente a logs/app.log de Python)
# ------------------------------------------------------------
logging.file.name=logs/app.log
logging.level.root=INFO
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss,SSS} - [%level] - %msg%n

# ------------------------------------------------------------
# Configuración general del sistema (antes: SistemaConfig en Python)
# anio-escolar=0  ->  usa automáticamente el año actual
# ------------------------------------------------------------
sgme.nombre-sistema=SGME - Sistema de Gestión de Matrícula Escolar
sgme.version=1.0.0
sgme.institucion=Colegio San Martín de Porres
sgme.anio-escolar=0
sgme.moneda=PEN
sgme.usuario.nombre=María Alvarado
sgme.usuario.cargo=Secretaría
